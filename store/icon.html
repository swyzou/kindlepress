<!doctype html><meta charset="utf-8"><style>
  html,body{margin:0;padding:0;width:128px;height:128px;background:transparent}
  .wrap{width:128px;height:128px;display:flex;align-items:center;justify-content:center}
  /* Cadre sombre = la liseuse. Page crème dedans = l'article. */
  .device{
    width:104px;height:104px;border-radius:24px;
    background:linear-gradient(160deg,#2a2a30 0%,#141418 100%);
    display:flex;align-items:center;justify-content:center;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.14);
  }
  .page{
    width:58px;height:70px;background:#f7f5f1;border-radius:4px;
    padding:11px 10px 0;box-sizing:border-box;position:relative;
  }
  /* coin corné */
  .page:after{content:"";position:absolute;top:0;right:0;
    border-width:0 13px 13px 0;border-style:solid;
    border-color:transparent #2a2a30 transparent transparent;border-radius:0 4px 0 0}
  .l{height:4px;border-radius:2px;background:#17171a;margin-bottom:6px}
  .l.a{width:60%}.l.b{width:100%}.l.c{width:100%}.l.d{width:72%}
</style>
<script>
  // Rend toujours le dessin en 128 puis le met à l'échelle de la cible,
  // sinon le rendu headless rogne au lieu de réduire.
  addEventListener('DOMContentLoaded', () => {
    const t = +(new URLSearchParams(location.search).get('s') || 128);
    const k = t / 128;
    document.documentElement.style.width = document.body.style.width = t + 'px';
    document.documentElement.style.height = document.body.style.height = t + 'px';
    const w = document.getElementById('w');
    w.style.transformOrigin = 'top left';
    w.style.transform = 'scale(' + k + ')';
  });
</script>
<div class="wrap" id="w"><div class="device"><div class="page">
  <div class="l a"></div><div class="l b"></div><div class="l c"></div><div class="l d"></div>
</div></div></div>
