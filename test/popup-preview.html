<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>KindlePress — popup preview</title>
    <style>
      body { margin: 0; background: #2a2a2a; font: 13px system-ui, sans-serif; color: #999; }
      .row { display: flex; gap: 24px; padding: 24px; align-items: flex-start; flex-wrap: wrap; }
      .case { background: #fff; border-radius: 10px; overflow: hidden; box-shadow: 0 6px 24px #0008; }
      .case.dark { background: #1b1b1b; }
      figcaption { padding: 6px 0 10px; font-size: 11px; color: #999; }
      iframe { width: 340px; height: 300px; border: 0; display: block; }
    </style>
  </head>
  <body>
    <div class="row" id="row"></div>
    <script>
      // Each frame renders the real popup markup against a stubbed chrome API,
      // so the three states can be inspected without loading the extension.
      const CASES = [
        { name: "success", scheme: "light" },
        { name: "success", scheme: "dark" },
        { name: "failure", scheme: "light" },
        { name: "no-images", scheme: "light" },
      ];
      const row = document.getElementById("row");
      for (const c of CASES) {
        const fig = document.createElement("figure");
        fig.style.margin = 0;
        const box = document.createElement("div");
        box.className = "case" + (c.scheme === "dark" ? " dark" : "");
        const f = document.createElement("iframe");
        f.src = `popup-frame.html?case=${c.name}&scheme=${c.scheme}`;
        box.appendChild(f);
        const cap = document.createElement("figcaption");
        cap.textContent = `${c.name} — ${c.scheme}`;
        fig.append(box, cap);
        row.appendChild(fig);
      }
    </script>
  </body>
</html>
